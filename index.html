<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maze Generator &amp; Solver</title>
    <style>
      /* ------------------------------------------------------------------
         Design tokens — cohesive dark palette, system fonts only.
         No external resources of any kind.
      ------------------------------------------------------------------ */
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --panel-border: #30363d;
        --fg: #c9d1d9;
        --muted: #8b949e;
        --accent: #58a6ff;
        --accent-soft: rgba(88, 166, 255, 0.18);
        --wall: #c9d1d9;
        --cell: #05070d;
        --explored: rgba(88, 166, 255, 0.22);
        --path: rgba(63, 185, 80, 0.55);
        --radius: 10px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        color-scheme: dark;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden; /* the canvas owns the viewport */
      }

      /* App shell: a left control rail + a full-bleed canvas stage. */
      #app {
        display: flex;
        height: 100vh;
        width: 100vw;
      }

      /* ---- Control panel (placeholders for later tasks) ---- */
      #panel {
        flex: 0 0 260px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1.25rem;
        background: var(--panel);
        border-right: 1px solid var(--panel-border);
        overflow-y: auto;
      }
      #panel h1 {
        font-size: 1.05rem;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.01em;
      }
      #panel .hint {
        font-size: 0.78rem;
        color: var(--muted);
        line-height: 1.45;
        margin: 0;
      }
      .group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .group label {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .placeholder {
        font-size: 0.8rem;
        color: var(--muted);
        font-style: italic;
        padding: 0.5rem 0.75rem;
        border: 1px dashed var(--panel-border);
        border-radius: 6px;
      }
      .btn {
        appearance: none;
        font: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--fg);
        background: var(--accent-soft);
        border: 1px solid var(--accent);
        border-radius: 8px;
        padding: 0.55rem 0.9rem;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.05s ease;
      }
      .btn:hover { background: rgba(88, 166, 255, 0.28); }
      .btn:active { transform: translateY(1px); }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .stats {
        font-size: 0.8rem;
        color: var(--muted);
        line-height: 1.6;
      }
      .stats span { color: var(--fg); }

      /* ---- Size controls ---- */
      .size-row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      .size-field {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        flex: 1 1 0;
      }
      .size-field span {
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
      }
      .num {
        appearance: none;
        font: inherit;
        font-size: 0.85rem;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--panel-border);
        border-radius: 6px;
        padding: 0.4rem 0.5rem;
        width: 100%;
        transition: border-color 0.15s ease;
      }
      .num:focus {
        outline: none;
        border-color: var(--accent);
      }
      .num.invalid {
        border-color: #f85149;
      }
      .size-error {
        font-size: 0.72rem;
        color: #f85149;
        min-height: 1em;
        line-height: 1.3;
      }

      /* ---- Canvas stage ---- */
      #stage {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        background: var(--cell);
      }
      #maze {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Responsive: collapse the rail under the canvas on narrow screens. */
      @media (max-width: 720px) {
        #app { flex-direction: column; }
        #panel { flex: 0 0 auto; border-right: none; border-bottom: 1px solid var(--panel-border); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Control rail. Buttons/inputs are added by later tasks; this is the
           stable layout scaffold. -->
      <aside id="panel" aria-label="Controls">
        <h1>Maze Generator &amp; Solver</h1>
        <p class="hint">Watch a perfect maze carve itself, then animate the shortest path. Controls arrive in the next steps.</p>

        <div class="group">
          <label>Controls</label>
          <button id="btn-regenerate" type="button" class="btn">Regenerate</button>
          <button id="btn-solve" type="button" class="btn">Solve</button>
        </div>

        <div class="group">
          <label>Maze size</label>
          <div class="size-row">
            <div class="size-field">
              <span>Columns</span>
              <input id="size-cols" type="number" class="num" min="5" max="100" step="1" value="25" inputmode="numeric" aria-label="Maze columns" />
            </div>
            <div class="size-field">
              <span>Rows</span>
              <input id="size-rows" type="number" class="num" min="5" max="100" step="1" value="18" inputmode="numeric" aria-label="Maze rows" />
            </div>
          </div>
          <div class="size-error" id="size-error" role="alert" aria-live="polite"></div>
        </div>

        <div class="group">
          <label>Algorithm</label>
          <div class="placeholder" id="algo-placeholder">Generator &amp; solver choice — coming soon</div>
        </div>

        <div class="group">
          <label>Stats</label>
          <div class="stats" id="stats">
            Cells: <span id="stat-cells">—</span><br />
            Explored: <span id="stat-explored">—</span><br />
            Path length: <span id="stat-path">—</span><br />
            Status: <span id="stat-status">ready</span>
          </div>
        </div>
      </aside>

      <!-- Full-viewport rendering surface. -->
      <main id="stage">
        <canvas id="maze" aria-label="Maze canvas"></canvas>
      </main>
    </div>

    <script>
      "use strict";
      /* ==================================================================
         Maze scaffold — rendering surface only.
         Later tasks plug in: generator, solver, animation, controls.
         Everything below is dependency-free vanilla JS.
      ================================================================== */

      const canvas = document.getElementById("maze");
      const ctx = canvas.getContext("2d");

      // ---- Application state ------------------------------------------------
      // Current grid dimensions (cells). Mutable via the size controls.
      let DEFAULT_COLS = 25;
      let DEFAULT_ROWS = 18;

      // Allowed range for both dimensions (inclusive).
      const MIN_DIM = 5;
      const MAX_DIM = 100;

      // Default start (top-left) and end (bottom-right) cells.
      // END_CELL is recomputed whenever the dimensions change.
      const START_CELL = { r: 0, c: 0 };
      let END_CELL = { r: DEFAULT_ROWS - 1, c: DEFAULT_COLS - 1 };

      /** @type {{ cols:number, rows:number, cells:Array<Array<{N:boolean,E:boolean,S:boolean,W:boolean}>> }} */
      let maze = makeEmptyMaze(DEFAULT_COLS, DEFAULT_ROWS);

      // Carving animation state. `animating` is true while a generation run
      // is in flight; `carveSteps` holds the ordered list of carve operations
      // produced by generateMazeAnimated().
      let animating = false;
      let carveSteps = [];
      let carveIndex = 0;

      // Solve animation state. Kept separate from the maze object so the
      // acceptance hook (solveMaze) stays pure. `mode` is one of:
      //   "idle" | "carving" | "exploring" | "pathing"
      let mode = "idle";
      // Ordered list of [row, col] cells as BFS visited them (exploration flood).
      let exploredOrder = [];
      let exploredIndex = 0;
      // Final shortest path [row, col] pairs, revealed after exploration.
      let solvePath = [];
      let pathIndex = 0;
      // Cells-per-frame batch sizes (tunable for a later speed-control task).
      const EXPLORE_PER_FRAME = 30;
      const PATH_PER_FRAME = 6;

      // ---- Maze data helpers ------------------------------------------------
      /**
       * Build an empty (fully walled) maze object.
       * Each cell stores four booleans: true = OPEN passage (no wall).
       * This is the exact shape later generator tasks will mutate.
       */
      function makeEmptyMaze(cols, rows) {
        const cells = [];
        for (let r = 0; r < rows; r++) {
          const row = [];
          for (let c = 0; c < cols; c++) {
            row.push({ N: false, E: false, S: false, W: false });
          }
          cells.push(row);
        }
        return { cols, rows, cells };
      }

      // ---- Maze generation (recursive backtracker) --------------------------
      /**
       * generateMaze(cols, rows) -> { cols, rows, cells }
       *
       * Pure recursive-backtracker (iterative, stack-based) perfect-maze
       * generator. Produces a spanning tree over the cols×rows grid:
       *   • every cell is reachable from every other cell, and
       *   • exactly cols*rows - 1 open passages exist (no loops).
       *
       * Each cell keeps four symmetric booleans (N/E/S/W); carving a passage
       * opens both sides at once and never crosses the grid border, so the
       * result is always symmetric and in-bounds. DOM-free and deterministic
       * given Math.random's state.
       *
       * @param {number} cols
       * @param {number} rows
       * @returns {{cols:number, rows:number, cells:Array<Array<{N:boolean,E:boolean,S:boolean,W:boolean}>>}}
       */
      function generateMaze(cols, rows) {
        cols = Math.max(1, Math.floor(cols));
        rows = Math.max(1, Math.floor(rows));
        const maze = makeEmptyMaze(cols, rows);
        const { cells } = maze;

        // visited[r][c] === true once a cell has been entered.
        const visited = Array.from({ length: rows }, () =>
          new Array(cols).fill(false)
        );

        // [dir, dRow, dCol, oppositeDir]
        const DIRS = [
          ["N", -1, 0, "S"],
          ["S", 1, 0, "N"],
          ["E", 0, 1, "W"],
          ["W", 0, -1, "E"],
        ];

        // Start the walk at the top-left cell.
        const stack = [[0, 0]];
        visited[0][0] = true;

        while (stack.length) {
          const [r, c] = stack[stack.length - 1];

          // Collect unvisited in-bounds neighbours.
          const options = [];
          for (let i = 0; i < DIRS.length; i++) {
            const dir = DIRS[i][0];
            const dr = DIRS[i][1];
            const dc = DIRS[i][2];
            const opp = DIRS[i][3];
            const nr = r + dr;
            const nc = c + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && !visited[nr][nc]) {
              options.push([dir, nr, nc, opp]);
            }
          }

          if (options.length === 0) {
            // Dead end: backtrack.
            stack.pop();
            continue;
          }

          // Carve a passage to a random unvisited neighbour.
          const choice = options[(Math.random() * options.length) | 0];
          const dir = choice[0];
          const nr = choice[1];
          const nc = choice[2];
          const opp = choice[3];

          cells[r][c][dir] = true; // open our side
          cells[nr][nc][opp] = true; // open their side (keeps symmetry)
          visited[nr][nc] = true;
          stack.push([nr, nc]);
        }

        return maze;
      }

      // ---- Animated generation (recursive backtracker w/ recorded steps) ----
      /**
       * generateMazeAnimated(cols, rows) -> { maze, steps }
       *
       * Same perfect-maze algorithm as generateMaze(), but records each carve
       * operation in order so the renderer can replay them as an animation.
       * Each step is { r, c, dir, nr, nc, opp }: "open dir on (r,c) and opp on
       * (nr,nc)". The returned maze is fully carved (a perfect spanning tree);
       * callers may ignore `steps` for an instant result.
       */
      function generateMazeAnimated(cols, rows) {
        cols = Math.max(1, Math.floor(cols));
        rows = Math.max(1, Math.floor(rows));
        const out = makeEmptyMaze(cols, rows);
        const { cells } = out;
        const steps = [];

        const visited = Array.from({ length: rows }, () =>
          new Array(cols).fill(false)
        );

        const DIRS = [
          ["N", -1, 0, "S"],
          ["S", 1, 0, "N"],
          ["E", 0, 1, "W"],
          ["W", 0, -1, "E"],
        ];

        const stack = [[0, 0]];
        visited[0][0] = true;

        while (stack.length) {
          const [r, c] = stack[stack.length - 1];
          const options = [];
          for (let i = 0; i < DIRS.length; i++) {
            const nr = r + DIRS[i][1];
            const nc = c + DIRS[i][2];
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && !visited[nr][nc]) {
              options.push([DIRS[i][0], nr, nc, DIRS[i][3]]);
            }
          }

          if (options.length === 0) {
            stack.pop();
            continue;
          }

          const choice = options[(Math.random() * options.length) | 0];
          const dir = choice[0];
          const nr = choice[1];
          const nc = choice[2];
          const opp = choice[3];

          cells[r][c][dir] = true;
          cells[nr][nc][opp] = true;
          visited[nr][nc] = true;
          stack.push([nr, nc]);
          steps.push({ r, c, dir, nr, nc, opp });
        }

        return { maze: out, steps };
      }

      // ---- Canvas sizing ----------------------------------------------------
      /** Device-pixel-ratio aware resize so walls stay crisp on HiDPI. */
      function resizeCanvas() {
        const stage = document.getElementById("stage");
        const rect = stage.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        // CSS size tracks the stage; backing store scales by DPR.
        canvas.width = Math.max(1, Math.floor(rect.width * dpr));
        canvas.height = Math.max(1, Math.floor(rect.height * dpr));
        canvas.style.width = rect.width + "px";
        canvas.style.height = rect.height + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // draw in CSS pixels
        render();
      }

      window.addEventListener("resize", resizeCanvas);

      // ---- Geometry ---------------------------------------------------------
      /**
       * Compute the pixel metrics for drawing a grid into the current stage.
       * The maze is centered and cell size is the largest that fits.
       */
      function gridMetrics() {
        const stage = document.getElementById("stage");
        const rect = stage.getBoundingClientRect();
        const pad = 12; // breathing room around the grid
        const availW = Math.max(0, rect.width - pad * 2);
        const availH = Math.max(0, rect.height - pad * 2);
        const cell = Math.max(
          1,
          Math.floor(Math.min(availW / maze.cols, availH / maze.rows))
        );
        const gridW = cell * maze.cols;
        const gridH = cell * maze.rows;
        const offsetX = Math.floor((rect.width - gridW) / 2);
        const offsetY = Math.floor((rect.height - gridH) / 2);
        return { cell, gridW, gridH, offsetX, offsetY, width: rect.width, height: rect.height };
      }

      // ---- Rendering --------------------------------------------------------
      /**
       * drawGrid(cells) — renders visible walls for a 2D cell array.
       * A wall is drawn on a side when that passage is CLOSED (false).
       * Acceptance target: visible cell walls matching grid dimensions.
       * @param {Array<Array<{N:boolean,E:boolean,S:boolean,W:boolean}>>} cells
       */
      function drawGrid(cells) {
        const rows = cells.length;
        const cols = rows ? cells[0].length : 0;
        const { cell, offsetX, offsetY } = gridMetrics();

        ctx.lineCap = "square";
        ctx.lineJoin = "miter";
        ctx.lineWidth = Math.max(1, Math.min(2, cell * 0.12));
        ctx.strokeStyle = getComputedStyle(document.documentElement)
          .getPropertyValue("--wall")
          .trim() || "#c9d1d9";

        ctx.beginPath();
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const x = offsetX + c * cell;
            const y = offsetY + r * cell;
            const w = cells[r][c];
            // Draw a wall on each closed side. (Open passage => no wall.)
            if (!w.N) line(x, y, x + cell, y); // top
            if (!w.S) line(x, y + cell, x + cell, y + cell); // bottom
            if (!w.W) line(x, y, x, y + cell); // left
            if (!w.E) line(x + cell, y, x + cell, y + cell); // right
          }
        }
        ctx.stroke();
      }

      /** Internal: queue a straight wall segment. */
      function line(x1, y1, x2, y2) {
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
      }

      /**
       * Highlight the default start (top-left) and end (bottom-right) cells so
       * they are visually distinct from the rest of the grid.
       */
      function drawEndpoints() {
        const { cell, offsetX, offsetY } = gridMetrics();
        const pad = Math.max(2, cell * 0.18);
        // Start cell — green (top-left).
        ctx.fillStyle = "#3fb950";
        ctx.fillRect(
          offsetX + START_CELL.c * cell + pad,
          offsetY + START_CELL.r * cell + pad,
          cell - pad * 2,
          cell - pad * 2
        );
        // End cell — amber (bottom-right).
        ctx.fillStyle = "#f0883e";
        ctx.fillRect(
          offsetX + END_CELL.c * cell + pad,
          offsetY + END_CELL.r * cell + pad,
          cell - pad * 2,
          cell - pad * 2
        );
      }

      /**
       * Paint the cells visited by BFS so far (up to exploredIndex) in the
       * explored color. Called every frame while mode === "exploring" or after.
       */
      function drawExplored() {
        if (exploredIndex === 0) return;
        const { cell, offsetX, offsetY } = gridMetrics();
        ctx.fillStyle = getComputedStyle(document.documentElement)
          .getPropertyValue("--explored")
          .trim() || "rgba(88,166,255,0.22)";
        for (let i = 0; i < exploredIndex; i++) {
          const [r, c] = exploredOrder[i];
          ctx.fillRect(offsetX + c * cell, offsetY + r * cell, cell, cell);
        }
      }

      /**
       * Paint the revealed portion of the shortest path (up to pathIndex) in
       * the path color. Drawn on top of explored cells so the final route
       * stands out.
       */
      function drawPath() {
        if (pathIndex === 0) return;
        const { cell, offsetX, offsetY } = gridMetrics();
        ctx.fillStyle = getComputedStyle(document.documentElement)
          .getPropertyValue("--path")
          .trim() || "rgba(63,185,80,0.55)";
        for (let i = 0; i < pathIndex; i++) {
          const [r, c] = solvePath[i];
          ctx.fillRect(offsetX + c * cell, offsetY + r * cell, cell, cell);
        }
      }

      /** Full frame: clear stage, draw grid + endpoints. Called by render loop + resize.
       *  Paint order: backdrop → explored → path → walls → endpoints (last). */
      function render() {
        const m = gridMetrics();
        ctx.clearRect(0, 0, m.width, m.height);
        // Subtle grid backdrop for empty cells.
        ctx.fillStyle = getComputedStyle(document.documentElement)
          .getPropertyValue("--cell")
          .trim() || "#05070d";
        ctx.fillRect(m.offsetX, m.offsetY, m.gridW, m.gridH);
        drawExplored();
        drawPath();
        drawGrid(maze.cells);
        drawEndpoints();
      }

      // ---- Render loop ------------------------------------------------------
      // A single requestAnimationFrame loop drives both idle rendering and the
      // carving animation. When `animating` is true, a batch of carve steps is
      // applied each frame; otherwise it just keeps the frame fresh.
      let rafId = 0;
      // Steps to apply per animation frame. Tuned so the default 25×18 grid
      // finishes carving in ~1s without frame drops.
      const STEPS_PER_FRAME = 12;

      function frame() {
        if (mode === "carving") {
          const cells = maze.cells;
          for (let i = 0; i < STEPS_PER_FRAME && carveIndex < carveSteps.length; i++) {
            const s = carveSteps[carveIndex++];
            cells[s.r][s.c][s.dir] = true;
            cells[s.nr][s.nc][s.opp] = true;
          }
          if (carveIndex >= carveSteps.length) {
            mode = "idle";
            updateStats("ready");
          }
        } else if (mode === "exploring") {
          // Reveal a batch of explored cells per frame (BFS flood order).
          const target = Math.min(exploredIndex + EXPLORE_PER_FRAME, exploredOrder.length);
          exploredIndex = target;
          updateStats("solving…");
          if (exploredIndex >= exploredOrder.length) {
            if (solvePath.length === 0) {
              // No path exists (e.g. solving a partially carved maze).
              mode = "idle";
              updateStats("no path");
            } else {
              mode = "pathing";
            }
          }
        } else if (mode === "pathing") {
          // Reveal the shortest path cells on top of the explored flood.
          const target = Math.min(pathIndex + PATH_PER_FRAME, solvePath.length);
          pathIndex = target;
          updateStats("solving…");
          if (pathIndex >= solvePath.length) {
            mode = "idle";
            updateStats("solved");
          }
        }
        render();
        rafId = requestAnimationFrame(frame);
      }

      /**
       * Start (or restart) an animated generation run. Cancels any in-flight
       * animation, resets the grid to fully walled, computes a fresh perfect
       * maze + carve steps, and replays them via the render loop.
       */
      function regenerate() {
        if (rafId) cancelAnimationFrame(rafId);
        // Reset all animation state so a mid-solve Regenerate is clean.
        mode = "carving";
        exploredOrder = [];
        exploredIndex = 0;
        solvePath = [];
        pathIndex = 0;
        // Keep the end cell anchored to the bottom-right of the current grid.
        END_CELL = { r: DEFAULT_ROWS - 1, c: DEFAULT_COLS - 1 };
        maze = makeEmptyMaze(DEFAULT_COLS, DEFAULT_ROWS);
        const result = generateMazeAnimated(DEFAULT_COLS, DEFAULT_ROWS);
        carveSteps = result.steps;
        carveIndex = 0;
        updateStats("carving…");
        rafId = requestAnimationFrame(frame);
      }

      // ---- Stats ------------------------------------------------------------
      // Clean stat rules:
      //   • explored: show progressive exploredIndex once a solve has started;
      //     "—" before any solve has ever run.
      //   • path: show progressive pathIndex once a path exists; "—" before
      //     any solve has ever run.
      //   • When fully idle after a solve, the indices equal the final totals.
      function updateStats(status) {
        document.getElementById("stat-cells").textContent =
          maze.cols * maze.rows;

        const hasSolved = exploredOrder.length > 0 || solvePath.length > 0;
        document.getElementById("stat-explored").textContent =
          hasSolved ? exploredIndex : "—";
        document.getElementById("stat-path").textContent =
          hasSolved ? pathIndex : "—";

        if (status) document.getElementById("stat-status").textContent = status;
      }

      // ---- Controls ---------------------------------------------------------
      const btnRegenerate = document.getElementById("btn-regenerate");
      btnRegenerate.addEventListener("click", regenerate);

      const btnSolve = document.getElementById("btn-solve");
      btnSolve.addEventListener("click", solve);

      // ---- Size controls ----------------------------------------------------
      // Numeric inputs for columns and rows. Values are clamped to
      // [MIN_DIM, MAX_DIM] on change; invalid entries show an inline error
      // and are rejected. A valid change regenerates the maze at the new size.
      const sizeCols = document.getElementById("size-cols");
      const sizeRows = document.getElementById("size-rows");
      const sizeError = document.getElementById("size-error");

      /**
       * Validate + clamp a dimension input.
       * Returns the accepted integer value, or NaN if the raw value is not a
       * usable number (empty / non-numeric). Caller decides whether to reject.
       * @param {HTMLInputElement} input
       * @returns {number}
       */
      function parseDim(input) {
        const raw = input.value.trim();
        if (raw === "") return NaN;
        // Reject anything that isn't a clean integer (no decimals, no text).
        if (!/^-?\d+$/.test(raw)) return NaN;
        return parseInt(raw, 10);
      }

      /**
       * Handle a change to either dimension input. Validates both fields,
       * shows an error for out-of-range/non-numeric values, and regenerates
       * the maze only when both dimensions are valid.
       */
      function handleSizeChange() {
        const colsRaw = parseDim(sizeCols);
        const rowsRaw = parseDim(sizeRows);

        /** @type {string[]} */
        const problems = [];

        if (Number.isNaN(colsRaw)) {
          problems.push("Columns must be a whole number.");
          sizeCols.classList.add("invalid");
        } else if (colsRaw < MIN_DIM || colsRaw > MAX_DIM) {
          problems.push("Columns must be " + MIN_DIM + "–" + MAX_DIM + ".");
          sizeCols.classList.add("invalid");
        } else {
          sizeCols.classList.remove("invalid");
        }

        if (Number.isNaN(rowsRaw)) {
          problems.push("Rows must be a whole number.");
          sizeRows.classList.add("invalid");
        } else if (rowsRaw < MIN_DIM || rowsRaw > MAX_DIM) {
          problems.push("Rows must be " + MIN_DIM + "–" + MAX_DIM + ".");
          sizeRows.classList.add("invalid");
        } else {
          sizeRows.classList.remove("invalid");
        }

        if (problems.length > 0) {
          sizeError.textContent = problems.join(" ");
          return; // reject — do not regenerate
        }

        // Both values are valid integers in range. Clamp defensively and apply.
        sizeError.textContent = "";
        const newCols = Math.min(MAX_DIM, Math.max(MIN_DIM, colsRaw));
        const newRows = Math.min(MAX_DIM, Math.max(MIN_DIM, rowsRaw));

        // Reflect clamped values back into the inputs.
        sizeCols.value = String(newCols);
        sizeRows.value = String(newRows);

        // Only regenerate if the size actually changed.
        if (newCols !== DEFAULT_COLS || newRows !== DEFAULT_ROWS) {
          DEFAULT_COLS = newCols;
          DEFAULT_ROWS = newRows;
          regenerate();
        }
      }

      sizeCols.addEventListener("change", handleSizeChange);
      sizeRows.addEventListener("change", handleSizeChange);

      // ---- Boot -------------------------------------------------------------
      // Defer first sizing until layout is measured, then play the opening
      // carving animation.
      updateStats("ready");
      requestAnimationFrame(() => {
        resizeCanvas();
        regenerate();
      });

      // ---- Animated solve (BFS exploration flood + path reveal) ------------
      /**
       * bfsWithOrder(maze, start, end) -> { explored, path }
       *
       * Same BFS as solveMaze() but also returns the ordered list of cells as
       * BFS dequeued them (the exploration flood order). `path` is the shortest
       * path (empty if unreachable). Used only by the animated solver; the
       * pure solveMaze() acceptance hook is unchanged.
       */
      function bfsWithOrder(maze, start, end) {
        const { cols, rows, cells } = maze;
        const sr = start[0], sc = start[1];
        const er = end[0], ec = end[1];
        const explored = [];
        if (
          rows <= 0 || cols <= 0 ||
          sr < 0 || sr >= rows || sc < 0 || sc >= cols ||
          er < 0 || er >= rows || ec < 0 || ec >= cols
        ) {
          return { explored, path: [] };
        }

        const prev = Array.from({ length: rows }, () => new Array(cols).fill(null));
        const visited = Array.from({ length: rows }, () => new Array(cols).fill(false));
        const queue = [sr * cols + sc];
        visited[sr][sc] = true;
        const DIRS = [["N", -1, 0], ["S", 1, 0], ["E", 0, 1], ["W", 0, -1]];
        let head = 0;
        let found = false;

        while (head < queue.length) {
          const cur = queue[head++];
          const r = (cur / cols) | 0;
          const c = cur - r * cols;
          explored.push([r, c]);
          if (r === er && c === ec) { found = true; break; }
          const cell = cells[r][c];
          for (let i = 0; i < DIRS.length; i++) {
            if (!cell[DIRS[i][0]]) continue;
            const nr = r + DIRS[i][1];
            const nc = c + DIRS[i][2];
            if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
            if (visited[nr][nc]) continue;
            visited[nr][nc] = true;
            prev[nr][nc] = [r, c];
            queue.push(nr * cols + nc);
          }
        }

        if (!found) return { explored, path: [] };
        const path = [];
        let curR = er, curC = ec;
        while (true) {
          path.push([curR, curC]);
          if (curR === sr && curC === sc) break;
          const p = prev[curR][curC];
          curR = p[0];
          curC = p[1];
        }
        path.reverse();
        return { explored, path };
      }

      /**
       * Start the two-phase solve animation. Cancels any in-flight carving or
       * solve, runs BFS to get exploration order + shortest path, then reveals
       * explored cells followed by the path via the render loop.
       */
      function solve() {
        if (rafId) cancelAnimationFrame(rafId);
        // Cancel any carving cleanly: solve the maze as it currently stands.
        const start = [START_CELL.r, START_CELL.c];
        const end = [END_CELL.r, END_CELL.c];
        const { explored, path } = bfsWithOrder(maze, start, end);
        exploredOrder = explored;
        exploredIndex = 0;
        solvePath = path;
        pathIndex = 0;
        mode = "exploring";
        updateStats("solving…");
        rafId = requestAnimationFrame(frame);
      }

      // ---- Maze solver (BFS shortest path) ----------------------------------
      /**
       * solveMaze(maze, start, end) -> Array<[number, number]>
       *
       * Pure, stateless breadth-first search over the maze's open passages.
       * Because every passage is unweighted and a perfect maze is a spanning
       * tree, the first time BFS reaches `end` it has found a shortest path.
       *
       * Returns the path as an ordered array of [row, col] pairs from `start`
       * to `end` inclusive. If no path exists (disconnected maze), returns an
       * empty array. DOM-free and side-effect free.
       *
       * @param {{cols:number, rows:number, cells:Array<Array<{N:boolean,E:boolean,S:boolean,W:boolean}>>}} maze
       * @param {[number, number]} start  [row, col] of the start cell
       * @param {[number, number]} end    [row, col] of the target cell
       * @returns {Array<[number, number]>}
       */
      function solveMaze(maze, start, end) {
        if (!maze || !maze.cells) return [];
        const { cols, rows, cells } = maze;
        const sr = start[0], sc = start[1];
        const er = end[0], ec = end[1];

        // Guard against out-of-bounds or degenerate inputs.
        if (
          rows <= 0 || cols <= 0 ||
          sr < 0 || sr >= rows || sc < 0 || sc >= cols ||
          er < 0 || er >= rows || ec < 0 || ec >= cols
        ) {
          return [];
        }

        // start === end: trivial single-cell path.
        if (sr === er && sc === ec) return [[sr, sc]];

        // prev[r][c] stores the [row, col] we arrived from (null = unvisited).
        const prev = Array.from({ length: rows }, () =>
          new Array(cols).fill(null)
        );
        const visited = Array.from({ length: rows }, () =>
          new Array(cols).fill(false)
        );

        // BFS queue. Each entry is a packed "r * cols + c" index to avoid
        // per-step array allocations; decoded back into [r, c] below.
        const queue = [sr * cols + sc];
        visited[sr][sc] = true;

        // [dirFlag, dRow, dCol] — dirFlag matches the cell's passage boolean.
        const DIRS = [
          ["N", -1, 0],
          ["S", 1, 0],
          ["E", 0, 1],
          ["W", 0, -1],
        ];

        let head = 0; // pointer avoids the O(n) cost of queue.shift()
        let found = false;

        while (head < queue.length) {
          const cur = queue[head++];
          const r = (cur / cols) | 0;
          const c = cur - r * cols;

          if (r === er && c === ec) { found = true; break; }

          const cell = cells[r][c];
          for (let i = 0; i < DIRS.length; i++) {
            const dir = DIRS[i][0];
            if (!cell[dir]) continue; // wall on this side → skip
            const nr = r + DIRS[i][1];
            const nc = c + DIRS[i][2];
            if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
            if (visited[nr][nc]) continue;
            visited[nr][nc] = true;
            prev[nr][nc] = [r, c];
            queue.push(nr * cols + nc);
          }
        }

        if (!found) return []; // end is unreachable

        // Reconstruct the path by walking predecessors back to start.
        const path = [];
        let curR = er, curC = ec;
        while (true) {
          path.push([curR, curC]);
          if (curR === sr && curC === sc) break;
          const p = prev[curR][curC];
          curR = p[0];
          curC = p[1];
        }
        path.reverse();
        return path;
      }

      // Expose stable hooks for later tasks + the optional test harness.
      window.generateMaze = generateMaze; // perfect-maze generator (acceptance hook)
      window.solveMaze = solveMaze; // BFS shortest-path solver (acceptance hook)
      window.__maze = {
        canvas,
        ctx,
        getMaze: () => maze,
        setMaze: (m) => { maze = m; updateStats(); },
        drawGrid,
        render,
        makeEmptyMaze,
        generateMaze,
        generateMazeAnimated,
        solveMaze,
        regenerate,
        solve,
        gridMetrics,
      };
    </script>
  </body>
</html>
